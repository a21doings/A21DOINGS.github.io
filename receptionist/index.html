<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A21 Receptionist - AI Assistant</title>
<style>
body {
font-family: Arial, sans-serif;
background: #f1f5f9;
margin: 0;
color: #172554;
}
header {
background: #102b50;
color: white;
text-align: center;
padding: 25px;
}
.container {
max-width: 600px;
margin: 30px auto;
padding: 20px;
}
.chat {
background: white;
padding: 20px;
border-radius: 12px;
box-shadow: 0 3px 12px #ccc;
}
#messages {
height: 300px;
overflow-y: auto;
border: 1px solid #ddd;
padding: 12px;
margin-bottom: 15px;
border-radius: 8px;
}
input {
width: 70%;
padding: 13px;
border: 1px solid #ccc;
border-radius: 6px;
}
button {
padding: 13px;
background: #0878df;
color: white;
border: none;
border-radius: 6px;
}
.bot { color: #0878df; }
.user { color: #15803d; }
</style>
</head>
<body>

<header>
<h1>A21 RECEPTIONIST</h1>
<p>Your Smart AI Business Assistant</p>
</header>

<div class="container">
<div class="chat">
<h2>Chat with A21 AI</h2>
<p>Ask me anything. I'm here to help!</p>

<div id="messages">
<p class="bot">A21 AI: Hello! Welcome to A21 Receptionist. How can I help you?</p>
</div>

<input id="message" placeholder="Type your message...">
<button onclick="sendMessage()">Send</button>

</div>
</div>

<script>
async function sendMessage() {
const input = document.getElementById("message");
const messages = document.getElementById("messages");
const message = input.value.trim();

if (!message) return;

messages.innerHTML +=
`<p class="user">You: ${escapeHTML(message)}</p>`;

input.value = "";

const loading = document.createElement("p");
loading.className = "bot";
loading.textContent = "A21 AI: Thinking...";
messages.appendChild(loading);
messages.scrollTop = messages.scrollHeight;

try {
const response = await fetch(
"https://a21-receptionist.onrender.com/chat",
{
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({ message })
}
);

const data = await response.json();

if (!response.ok) {
throw new Error(data.error || "Request failed");
}

loading.textContent = "A21 AI: " + data.reply;

} catch (error) {
loading.textContent =
"A21 AI: Sorry, connection failed. Please try again.";
console.error(error);
}

messages.scrollTop = messages.scrollHeight;
}

function escapeHTML(text) {
return text.replace(/[&<>"']/g, char => ({
"&": "&amp;",
"<": "&lt;",
">": "&gt;",
'"': "&quot;",
"'": "&#039;"
})[char]);
}
</script>

</body>
</html>
